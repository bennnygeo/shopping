<div class="login-form">
    <div class="details">
        <app-title title="Login"></app-title>

        <form [formGroup]="loginForm" (ngSubmit)="submit()">
            <div class="input-container">
                <label for="">Email</label>
                <div>
                    <input type="email" placeholder="Email" formControlName="email" />
                </div>
                @if(fc.email.errors && isSubmitted){

                @if(fc.email.errors.required){
                <div class="error-list">Should not be empty!</div>
                }

                @if(fc.email.errors.email){
                <div class="error-list">Email is not correct!</div>
                }
                }
            </div>

            <div class="input-container">
                <label for="">Password</label>
                <div>
                    <input type="password" placeholder="Password" formControlName="password" />
                </div>

                @if(fc.password.errors && isSubmitted){
                @if(fc.password.errors.required){
                <div class="error-list">Should not be empty!</div>
                }
                }

            </div>

            <div class="button">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>
</div>
